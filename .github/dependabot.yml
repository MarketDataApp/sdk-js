# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Bundle all action bumps into a single PR.
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # Wait before adopting new releases so compromised versions (npm
    # supply-chain attacks) can be caught and yanked first. Known CVEs still
    # arrive immediately via Dependabot security updates.
    cooldown:
      default-days: 7
    # One PR for minor/patch bumps across both runtime and dev dependencies;
    # majors stay separate PRs since they can break consumers and need
    # individual review. Previously only development dependencies were
    # grouped, so every runtime minor/patch opened its own PR.
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/examples"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      examples-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
