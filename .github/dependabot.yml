# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # Wait before adopting new releases so compromised versions (npm
    # supply-chain attacks) can be caught and yanked first. Known CVEs still
    # arrive immediately via Dependabot security updates.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/examples"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      examples-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
