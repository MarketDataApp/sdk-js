name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test with coverage
        run: pnpm test:coverage
        env:
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}

      - name: Upload coverage artifact
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Build
        run: pnpm build

  integration:
    # Live-API tests gated by `MARKETDATA_RUN_INTEGRATION_TESTS=true`.
    # Runs on pushes to main and on PRs from the same repo (secret is
    # available). Fork PRs skip this job automatically because the
    # secret is empty.
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:integration
        env:
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
