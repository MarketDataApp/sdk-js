name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package.json version matches release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Publishing version: $PKG_VERSION"

      - name: Build & verify
        run: pnpm prepublishOnly
        env:
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}

      - name: Determine npm dist-tag
        id: disttag
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "Publishing as pre-release under dist-tag 'next'"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "Publishing as stable under dist-tag 'latest'"
          fi

      - name: Diagnostics — versions and .npmrc state
        run: |
          echo "Node:  $(node --version)"
          echo "npm:   $(npm --version)"
          echo "pnpm:  $(pnpm --version)"
          echo "---"
          echo "Project .npmrc (if any):"
          [ -f .npmrc ] && cat .npmrc || echo "(no project .npmrc)"
          echo "---"
          echo "User .npmrc:"
          [ -f ~/.npmrc ] && sed 's/_authToken=.*/_authToken=<REDACTED>/' ~/.npmrc || echo "(no ~/.npmrc)"
          echo "---"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo no)"
          echo "NODE_AUTH_TOKEN set: $([ -n "$NODE_AUTH_TOKEN" ] && echo yes || echo no)"

      - name: Publish to npm (via Trusted Publishing OIDC)
        env:
          DIST_TAG: ${{ steps.disttag.outputs.tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG" --loglevel verbose
