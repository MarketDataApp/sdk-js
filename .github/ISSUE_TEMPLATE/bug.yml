name: Bug Report
description: Report a bug in the Market Data JavaScript SDK
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out all required fields to help us reproduce and fix the issue.

        **Important:** The SDK returns data exactly as the API provides it. Before reporting, please verify the behavior you're seeing differs from what the [API documentation](https://www.marketdata.app/docs/api) describes.

  - type: checkboxes
    id: api-docs-verified
    attributes:
      label: API Documentation Verification
      description: Confirm you've checked the API documentation before reporting this as an SDK bug.
      options:
        - label: I have reviewed the [API documentation](https://www.marketdata.app/docs/api) for this endpoint
          required: true
        - label: The behavior I'm reporting differs from what the API documentation describes (not just unexpected to me)
          required: true

  - type: dropdown
    id: endpoint
    attributes:
      label: SDK Endpoint
      description: Which part of the SDK is affected?
      options:
        - stocks
        - options
        - markets
        - funds
        - utilities
        - Client (general)
        - Other
    validations:
      required: true

  - type: input
    id: method
    attributes:
      label: Method
      description: Which method are you calling? (e.g., candles, prices, chain)
      placeholder: candles
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Code
      description: Complete, runnable TypeScript or JavaScript that demonstrates the bug. Must be self-contained.
      placeholder: |
        import { MarketDataClient } from '@marketdata/sdk';

        const client = new MarketDataClient();
        const result = await client.stocks.candles('AAPL', {
          resolution: '1D',
          from: new Date('2024-01-01'),
        });
        // Bug: ...
      render: typescript
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: The method should return candle data for the specified date range.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens? Include the complete error message and stack trace.
      placeholder: |
        TypeError: Cannot read properties of undefined (reading 'close')
            at ...
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: SDK Version
      description: Run `pnpm list @marketdata/sdk` (or `npm ls @marketdata/sdk`) to find this
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node Version
      description: Run `node -v` to find this
      placeholder: "20.11.0"
    validations:
      required: true

  - type: dropdown
    id: package-manager
    attributes:
      label: Package Manager
      options:
        - pnpm
        - npm
        - yarn
        - bun
        - Other
    validations:
      required: true

  - type: dropdown
    id: module-system
    attributes:
      label: Module System
      description: Which build of the SDK are you importing?
      options:
        - ESM (import)
        - CommonJS (require)
        - Unknown
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Context
      description: Any other relevant information (config, workarounds tried, links to related issues, etc.)
    validations:
      required: false
